<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96">
<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>FUTURE AI – Il gioco</title>
<meta name="robots" content="noindex">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{--fondo:#05060d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fondo);color:#fff;font-family:'Space Mono',monospace;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none}
.scena{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
.schermo{position:relative;height:min(calc(100svh - 16px),calc((100vw - 16px) * 16 / 9));aspect-ratio:9/16;border-radius:22px;overflow:hidden;
  box-shadow:0 0 0 3px #1b1f2e,0 0 0 6px #0b0d15,0 30px 80px rgba(0,0,0,.8),0 0 80px rgba(108,99,255,.25)}
.schermo.oriz{height:auto;width:min(calc(100vw - 16px),calc((100svh - 16px) * 16 / 9));aspect-ratio:16/9}
.oriz .pannello{padding-bottom:9%;gap:9px}
@media (max-height:520px){.oriz .pannello{gap:5px;padding-bottom:5%}.oriz .testo-p{font-size:10px}.oriz .btn{padding:.55em 1.1em}}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
/* effetto tubo catodico come nel video */
.crt{position:absolute;inset:0;pointer-events:none;border-radius:22px;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%)}
.pannello{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;
  padding:0 8% 16%;text-align:center;z-index:3}
.pannello[hidden]{display:none}
.titolo-p{font:800 clamp(18px,5.4vmin,30px)/1.1 'Manrope',sans-serif;letter-spacing:-.02em;text-shadow:0 3px 0 #000}
.testo-p{font-size:clamp(10px,2.6vmin,13px);line-height:1.5;color:#cfe;max-width:30ch;text-shadow:0 2px 0 #000}
.btn{appearance:none;border:0;cursor:pointer;font:700 clamp(12px,3vmin,15px) 'Space Mono',monospace;letter-spacing:.06em;
  padding:.8em 1.4em;border-radius:10px;color:#fff;background:linear-gradient(90deg,#6C63FF,#4DD9E0);
  box-shadow:0 4px 0 #2b2466,0 10px 30px rgba(108,99,255,.5);text-decoration:none;display:inline-block}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2b2466}
.btn.sec{background:rgba(10,12,24,.8);box-shadow:0 0 0 2px #4DD9E0 inset}
.lampeggia{animation:lamp 1.1s steps(2) infinite}
@keyframes lamp{50%{opacity:0}}
.tasti-pc{font-size:clamp(9px,2.2vmin,11px);color:#9ab;line-height:1.7}
/* comandi touch */
.comandi{position:absolute;left:0;right:0;bottom:0;z-index:2;display:none;justify-content:space-between;align-items:flex-end;padding:0 4% 4%;pointer-events:none}
.touch.giocando .comandi{display:flex}
.gruppo{display:flex;gap:10px;pointer-events:auto}
.tasto{width:clamp(48px,15vmin,64px);height:clamp(48px,15vmin,64px);border-radius:50%;border:2px solid rgba(255,255,255,.35);
  background:rgba(10,12,24,.45);color:#fff;font:700 16px 'Space Mono',monospace;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.tasto.giu{background:rgba(77,217,224,.4);border-color:#4DD9E0}
.tasto.salta{background:rgba(108,99,255,.35)}.tasto.spara{background:rgba(255,79,216,.3)}
.giocando .torna{display:none}
/* stile tutto suo: se eredita quello di .audio si allarga su tutto lo schermo e ruba i clic */
.torna{position:absolute;top:10px;left:12px;z-index:4;background:rgba(0,0,0,.4);color:#fff;border-radius:8px;font:700 11px 'Space Mono',monospace;padding:6px 8px;text-decoration:none}
.torna[hidden]{display:none}
.audio{position:absolute;top:10px;right:12px;z-index:4;appearance:none;border:0;background:rgba(0,0,0,.4);color:#fff;border-radius:8px;
  font:700 11px 'Space Mono',monospace;padding:6px 8px;cursor:pointer}
</style>
</head>
<body>
<div class="scena">
  <div class="schermo" id="schermo">
    <canvas id="c" width="144" height="256" aria-label="Gioco FUTURE AI"></canvas>
    <div class="crt"></div>
    <button class="audio" id="audio" type="button" aria-pressed="true">♪ ON</button>
    <a class="torna" id="torna" href="/giochi/" hidden>← Sito</a>

    <div class="pannello" id="pInizio">
      <button class="btn" id="bGioca" type="button">▶ GIOCA</button>
      <div class="tasti-pc" id="tastiPc">← → muoviti · SPAZIO salta · X spara</div>
    </div>
    <div class="pannello" id="pPersa" hidden>
      <div class="titolo-p">GAME OVER</div>
      <div class="testo-p">I bug hanno avuto la meglio. Riparti dall'ultima bandiera.</div>
      <button class="btn" id="bRiprova" type="button">↻ RIPROVA</button>
    </div>
    <div class="pannello" id="pVinta" hidden>
      <div class="titolo-p">LIVELLO COMPLETATO!</div>
      <div class="testo-p" id="punteggio"></div>
      <div class="testo-p">Vuoi un gioco così con il tuo marchio?</div>
      <a class="btn" href="/#contatti" target="_top">PARLIAMONE →</a>
      <button class="btn sec" id="bRigioca" type="button">↻ RIGIOCA</button>
    </div>

    <div class="comandi" aria-hidden="true">
      <div class="gruppo"><div class="tasto" data-k="sx">◀</div><div class="tasto" data-k="dx">▶</div></div>
      <div class="gruppo"><div class="tasto spara" data-k="spara">✦</div><div class="tasto salta" data-k="salta">▲</div></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var cv=document.getElementById('c'),g=cv.getContext('2d');
// 9:16 su telefono in verticale, 16:9 su computer e telefono in orizzontale
var T=12,S=2,W,H,ROWS,GY,ORIZ,PROF;
function scegliFormato(){ORIZ=innerWidth>innerHeight;W=ORIZ?256:144;H=ORIZ?144:256;ROWS=Math.ceil(H/T);GY=ORIZ?8:13;
  PROF=Math.min(5,ROWS-1-GY); // profondita' delle buche: il fondo con le punte deve restare dentro lo schermo
  cv.width=W*S;cv.height=H*S;g.imageSmoothingEnabled=false;document.getElementById('schermo').classList.toggle('oriz',ORIZ);}
function R(a,b){return a+Math.random()*(b-a);}
function lim(v,a,b){return v<a?a:v>b?b:v;}
function tela(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}

/* ---------- pixel art ---------- */
var PAL={k:'#160f22',c:'#23262f',C:'#3b404d',h:'#2b1a12',s:'#f0b48a',S:'#c98a63',e:'#160f22',t:'#6f7684',T:'#4b5261',
  j:'#2f4d8a',J:'#20366a',b:'#0d0d12',w:'#d9d2bd',W:'#b8ae93',q:'#1d3b4c',r:'#ff3b5c',B:'#3d6bd6',x:'#e8eef8',g:'#9aa4b8'};
function sprite(righe){var h=righe.length,w=righe[0].length,[c,x]=tela(w,h);
  for(var y=0;y<h;y++)for(var i=0;i<w;i++){var ch=righe[y][i];if(ch!=='.'&&ch!==' '&&PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,y,1,1);}}return c;}
function specchia(s){var [c,x]=tela(s.width,s.height);x.translate(s.width,0);x.scale(-1,1);x.drawImage(s,0,0);return c;}
var BUSTO=[
".....kkkkk....",
"....kcccccck..",
"..kkccccccCk..",
"..kkkhhsssssk.",
"....khsssesk..",
"....khsssssk..",
"....kkSsssk...",
".....kkSSkk...",
"...kttttttk...",
"..kttttttttk..",
"..ktTttttTtk..",
"..ksTttttTsk..",
"..kskttttksk..",
"...kkttttkk...",
"....kjjjjk....",
"....kjjJjk...."];
var GAMBE={
 fermo:["....kjk.kjk...","....kjk.kjk...","....kjk.kjk...","....kJk.kJk...","...kbbk.kbbk..","...kkkk.kkkk.."],
 corsaA:["...kjjk.kjk...","..kjjk...kjk..",".kjjk.....kjk.",".kJk......kJk.","kbbk.....kbbk.","kkk......kkk.."],
 corsaB:["....kjjjk.....","....kjjjk.....",".....kjJk.....",".....kjjk.....","....kbbbk.....","....kkkkk....."],
 salto:["....kjjk.kjk..","...kjjk..kjk..","...kjk...kjjk.","...kJk....kbk.","..kbbk....kk..","..kkk........."]};
var PG={};for(var n in GAMBE){PG[n]=sprite(BUSTO.concat(GAMBE[n]));PG[n+'_s']=specchia(PG[n]);}
var MON=[
"..kkkkkkkkkkkk..",
".kwwwwwwwwwwwwk.",
".kwkkkkkkkkkkwk.",
".kwkqqqqqqqqkwk.",
".kwkqrrqqrrqkwk.",
".kwkqqrqqrqqkwk.",
".kwkqqqqqqqqkwk.",
".kwkqqkkkkqqkwk.",
".kwkkkkkkkkkkwk.",
".kwwwwwwwwwWWwk.",
".kkkkkkkkkkkkkk.",
"....kwwwwwwk....",
"..kkkkkkkkkkkk.."];
var monA=sprite(MON.concat(["...kk..kk..kk...","...k....k....k.."])),monB=sprite(MON.concat(["....kk..kk..kk..","....k....k....k."]));
var POP=sprite([
"kkkkkkkkkkkkkkkkkk",
"kBBBBBBBBBBBBxkxxk",
"kBBBBBBBBBBBBkkkkk",
"kxxxxxxxxxxxxxxxxk",
"kxkkkkkxxxxxxxxxxk",
"kxkrxrkxxggggggxxk",
"kxkxrxkxxxxxxxxxxk",
"kxkrxrkxxggggxxxxk",
"kxkkkkkxxxxxxxxxxk",
"kxxxxxxxxggggggxxk",
"kxxxxxxxxxxxxxxxxk",
"kkkkkkkkkkkkkkkkkk"]);
var CUORE=sprite([".kk.kk.","krrkrrk","krrrrrk",".krrrk.","..krk..","...k..."]);
var CUOREV=(function(){var s=CUORE,[c,x]=tela(s.width,s.height);x.globalAlpha=.3;x.drawImage(s,0,0);return c;})();
var logo=new Image();logo.src='/img/logo-intro.webp';
// grafica fatta con Gemini: gia' scontornata e portata alla misura (2 pixel per unita')
var IMG={};['pg-fermo','pg-corsa','pg-vittoria','n-ragno','n-granchio','n-ruota','n-do','boss'].forEach(function(n){var i=new Image();i.src='/gioco/img/'+n+'.png';IMG[n]=i;});
var SF=new Image();SF.src='/gioco/img/sfondo.webp';
var TIPI=[{sp:'n-ragno',w:20,h:22},{sp:'n-granchio',w:26,h:20},{sp:'n-ruota',w:14,h:20},{sp:'n-do',w:22,h:20}];
function spr(im,x,y,flip,hh){if(!im||!im.complete||!im.naturalWidth)return;var h=hh||im.height/S,w=im.width/S*h/(im.height/S);
  x=Math.round(x*S)/S;y=Math.round(y*S)/S;if(flip){g.save();g.translate(x+w,y);g.scale(-1,1);g.drawImage(im,0,0,w,h);g.restore();}else g.drawImage(im,x,y,w,h);}
function sfondo(frac){if(!(SF.complete&&SF.naturalWidth)){g.drawImage(sfA,0,0);return;}
  var h=H,w=SF.width*h/SF.height;if(w<W){w=W;h=SF.height*w/SF.width;}
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(SF,-(w-W)*frac,0,w,h);g.imageSmoothingEnabled=false;
  g.fillStyle='rgba(8,6,24,.32)';g.fillRect(0,0,W,H);}

/* ---------- sfondo a strati (disegnati una volta) ---------- */
function seme(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}
var sfA,sfB;
function creaSfA(){return (function(){var [c,x]=tela(W,H),gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#090b22');gr.addColorStop(.55,'#1c1242');gr.addColorStop(1,'#2d1650');
  x.fillStyle=gr;x.fillRect(0,0,W,H);var r=seme(7);
  // piste di circuito
  for(var i=0;i<46;i++){var px=Math.floor(r()*W),py=Math.floor(r()*H*.75),len=10+Math.floor(r()*40);
    x.strokeStyle=r()<.7?'rgba(55,227,220,.22)':'rgba(255,79,216,.18)';x.lineWidth=1;x.beginPath();x.moveTo(px+.5,py+.5);
    var vx=px,vy=py;for(var k=0;k<3;k++){if(k%2===0)vx+=(r()<.5?-1:1)*len;else vy+=(r()<.5?-1:1)*len*.6;x.lineTo(Math.round(vx)+.5,Math.round(vy)+.5);}
    x.stroke();x.fillStyle='rgba(55,227,220,.5)';x.fillRect(Math.round(vx)-1,Math.round(vy)-1,3,3);}
  return c;})();}
function creaSfB(){return (function(){var w=W*3,[c,x]=tela(w,H),r=seme(21);
  // codice che scorre in lontananza
  x.font='5px monospace';x.fillStyle='rgba(120,240,230,.28)';
  var pz=['if(err){','  return fix();','}','const ai=new Brain();','await ai.learn(data);','for(let i=0;i<n;i++)','deploy("prod");','// TODO: bug','sync(crm,gmail);'];
  for(var i=0;i<50;i++)x.fillText(pz[Math.floor(r()*pz.length)],Math.floor(r()*w),14+Math.floor(r()*(GY*T-40)));
  // skyline pixel
  for(var bx=0;bx<w;){var bw=10+Math.floor(r()*22),bh=24+Math.floor(r()*80),base=GY*T;x.fillStyle=r()<.5?'#241a48':'#2b1f55';
    x.fillRect(bx,base-bh,bw,bh);x.fillStyle='rgba(77,217,224,.55)';
    for(var yy=base-bh+4;yy<base-4;yy+=6)for(var xx=bx+2;xx<bx+bw-2;xx+=4)if(r()<.35)x.fillRect(xx,yy,2,2);bx+=bw+Math.floor(r()*4);}
  return c;})();}

/* ---------- livello ---------- */
var L=700,grid,spine,deco,BANDIERE,ARENA,nemiciBase,CHIP;
function pieno(c,r){if(c<0)return 1;if(c>=L||r<0)return 0;if(r>=ROWS)return 1;return grid[r*L+c];}
function terra(c0,c1,top){for(var c=c0;c<=c1;c++)for(var r=top===undefined?GY:top;r<ROWS;r++)grid[r*L+c]=1;}
function piatt(c0,c1,r){for(var c=c0;c<=c1;c++)grid[r*L+c]=2;}
function buca(c0,c1){terra(c0,c1,GY+PROF);spine.push({x:c0*T,y:(GY+PROF-1)*T+4,w:(c1-c0+1)*T,h:8});}
// le finestre volanti: in orizzontale c'e' meno cielo, restano almeno 2 righe sotto il bordo
function alto(k){return Math.max(2,GY-k);}
/* Il livello e' costruito a tratti, sempre uguale (seme fisso): pianure con nemici,
   buche, scalinate di piattaforme, buche doppie, ondate, bandiere di salvataggio.
   Lungo apposta: 3-4 minuti per arrivare al boss e batterlo. */
function costruisci(){grid=new Uint8Array(L*ROWS);spine=[];deco=[];BANDIERE=[];nemiciBase=[];CHIP=[];
  var r=seme(42);function ri(a,b){return a+Math.floor(r()*(b-a+1));}
  function nem(c){nemiciBase.push(['m',c]);}function pop(c,k){nemiciBase.push(['p',c,alto(k)]);}
  function chip(c,riga){CHIP.push({x:c*T+3,y:riga*T-13,w:7,h:8,preso:false});}
  var c=0;terra(0,13);deco.push({t:'pc',x:4*T});chip(8,GY);chip(9,GY);chip(10,GY);c=14;
  var SEQ=['piano','buca','scala','buca','ondata','band','lunga','piano','doppia','scala','ondata','buca','band',
    'lunga','scala','doppia','ondata','piano','buca','scala','band','lunga','ondata','doppia','piano','scala','buca','ondata','lunga','piano',
    'band','doppia','ondata','scala','lunga','piano','buca','ondata','scala','piano'];
  SEQ.forEach(function(tipo){var n,w,m;
    if(tipo==='piano'){n=ri(14,18);terra(c,c+n-1);nem(c+ri(6,n-4));if(r()<.6)nem(c+n-2);pop(c+ri(4,n-3),ri(5,8));for(m=2;m<5;m++)chip(c+m,GY);c+=n;}
    else if(tipo==='buca'){w=ri(2,3);buca(c,c+w-1);for(m=0;m<w;m++)chip(c+m,GY-3);c+=w;}
    else if(tipo==='lunga'){w=ri(5,6);buca(c,c+w-1);m=c+Math.floor(w/2)-1;piatt(m,m+2,GY-3);chip(m,GY-3);chip(m+1,GY-3);chip(m+2,GY-3);c+=w;}
    else if(tipo==='scala'){n=18;terra(c,c+n-1);piatt(c+3,c+6,GY-3);piatt(c+8,c+11,GY-6);piatt(c+13,c+15,GY-3);
      for(m=8;m<12;m++)chip(c+m,GY-6);pop(c+10,9);nem(c+15);c+=n;}
    else if(tipo==='doppia'){buca(c,c+2);terra(c+3,c+5);buca(c+6,c+8);chip(c+1,GY-3);chip(c+4,GY);chip(c+7,GY-3);c+=9;}
    else if(tipo==='ondata'){n=20;terra(c,c+n-1);nem(c+6);nem(c+11);nem(c+16);pop(c+9,7);chip(c+2,GY);chip(c+3,GY);c+=n;}
    else if(tipo==='band'){n=10;terra(c,c+n-1);BANDIERE.push({x:(c+4)*T,y:GY*T,presa:false});deco.push({t:'pc',x:(c+1)*T});c+=n;}
  });
  terra(c,L-1);ARENA={l:(c+6)*T,r:(c+6)*T+W};deco.push({t:'pc',x:(c+2)*T});}
function configura(){scegliFormato();sfA=creaSfA();sfB=creaSfB();costruisci();}
configura();
var tileT=(function(){var [c,x]=tela(T,T);x.fillStyle='#1b2244';x.fillRect(0,0,T,T);x.fillStyle='#37e3dc';x.fillRect(0,0,T,2);
  x.fillStyle='rgba(55,227,220,.35)';x.fillRect(0,2,1,T-2);x.fillRect(T-1,2,1,T-2);x.fillRect(0,T-1,T,1);x.fillStyle='rgba(55,227,220,.15)';x.fillRect(5,4,2,2);return c;})();
var tileD=(function(){var [c,x]=tela(T,T);x.fillStyle='#211738';x.fillRect(0,0,T,T);x.fillStyle='rgba(155,127,248,.35)';x.fillRect(0,5,7,1);x.fillRect(6,5,1,7);
  x.fillStyle='rgba(255,79,216,.25)';x.fillRect(8,2,3,1);return c;})();
var tileP=(function(){var [c,x]=tela(T,T);x.fillStyle='#232a52';x.fillRect(0,0,T,6);x.fillStyle='#4DD9E0';x.fillRect(0,0,T,2);x.fillStyle='rgba(77,217,224,.4)';x.fillRect(0,5,T,1);return c;})();

/* ---------- audio 8 bit ---------- */
var AC=null,suono=true;
function tono(f,d,tipo,vol,scivola){if(!suono)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime;
  o.type=tipo||'square';o.frequency.setValueAtTime(f,t);if(scivola)o.frequency.exponentialRampToValueAtTime(scivola,t+d);v.gain.setValueAtTime(vol||.06,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}
var SFX={salto:function(){tono(380,.14,'square',.05,760);},sparo:function(){tono(1200,.08,'sawtooth',.03,300);},
  colpo:function(){tono(200,.12,'square',.05,90);},boom:function(){tono(140,.35,'sawtooth',.07,40);},
  male:function(){tono(300,.25,'triangle',.08,80);},band:function(){[523,659,784].forEach(function(f,i){setTimeout(function(){tono(f,.12,'square',.05);},i*90);});},
  vinto:function(){[523,659,784,1047,784,1047].forEach(function(f,i){setTimeout(function(){tono(f,.16,'square',.06);},i*130);});}};

/* ---------- stato ---------- */
var tasti={},stato='inizio',t=0,cam=0,camLock=false,punti=0,scossa=0;
var raccolti=0,tempo=0,p,nemici=[],colpi=[],colpiNem=[],parti=[],boss=null,fuochi=[],rinascita;
function nuovaPartita(daBandiera){
  var ult=null;BANDIERE.forEach(function(b){if(b.presa)ult=b;});
  if(!daBandiera){ult=null;BANDIERE.forEach(function(b){b.presa=false;});CHIP.forEach(function(k){k.preso=false;});punti=0;raccolti=0;tempo=0;}
  rinascita=ult?{x:ult.x+14,y:GY*T-27}:{x:2*T,y:GY*T-27};
  p={x:rinascita.x,y:rinascita.y,w:10,h:25,vx:0,vy:0,terra:false,dir:1,vite:3,inv:0,cool:0,coyote:0,buf:0,anim:0};
  nemici=nemiciBase.filter(function(n){return !ult||n[1]*T>ult.x;}).map(function(n){

  spr(IMG['n-ragno'],ORIZ?W/2+60:W/2+30,GY*T-24+(Math.floor(t/10)%2),false,24);g.drawImage(POP,ORIZ?W/2-110:W/2-58,(ORIZ?GY*T-60:GY*T-44)+Math.round(Math.sin(t*.05)*4));}

/* ---------- ciclo ---------- */
var ultimo=0,accu=0,PASSO=1000/60;
function ciclo(ora){requestAnimationFrame(ciclo);if(!ultimo)ultimo=ora;accu+=Math.min(100,ora-ultimo);ultimo=ora;
  while(accu>=PASSO){if(stato!=='pausa')aggiorna();accu-=PASSO;}disegna();}
requestAnimationFrame(ciclo);
var girTimer=0;addEventListener('resize',function(){clearTimeout(girTimer);girTimer=setTimeout(function(){
  if((innerWidth>innerHeight)!==ORIZ){configura();cam=0;stato='inizio';tasti={};mostra('pInizio');}},200);});
// solo per le prove: /gioco/?debug
if(/debug/.test(location.search))window.__g={get p(){return p;},get stato(){return stato;},get boss(){return boss;},get nemici(){return nemici;},get punti(){return punti;},
  vai:function(col){p.x=col*T;p.y=GY*T-40;p.vy=0;},vite:function(){p.vite=99;},get arena(){return ARENA;},get chip(){return [raccolti,CHIP.length];},get band(){return BANDIERE.map(function(b){return b.presa;});},get tempo(){return tempo;}};

/* ---------- pannelli e comandi ---------- */
function mostra(id){['pInizio','pPersa','pVinta'].forEach(function(k){document.getElementById(k).hidden=k!==id;});document.body.classList.toggle('giocando',!id);}
function parti_(daBandiera){nuovaPartita(daBandiera);stato='gioco';mostra(null);cv.focus&&cv.focus();}
document.getElementById('bGioca').onclick=function(){parti_(false);};
document.getElementById('bRiprova').onclick=function(){parti_(true);};
document.getElementById('bRigioca').onclick=function(){parti_(false);};
// aperto da solo (non dentro la sezione del sito): serve la strada per tornare
// ...o aperto nella cornice della musica del sito, che per chi guarda e' come una pagina a se'
var daSolo=window.top===window.self;try{daSolo=daSolo||(window.parent===window.top&&!!window.parent.__musicaFutureAI);}catch(e){}
if(daSolo)document.getElementById('torna').hidden=false;
var ba=document.getElementById('audio');ba.onclick=function(){suono=!suono;ba.textContent=suono?'♪ ON':'♪ OFF';ba.setAttribute('aria-pressed',suono);};
var MAPPA={ArrowLeft:'sx',KeyA:'sx',ArrowRight:'dx',KeyD:'dx',Space:'salta',ArrowUp:'salta',KeyW:'salta',KeyX:'spara',KeyJ:'spara',KeyK:'spara'};
addEventListener('keydown',function(e){var k=MAPPA[e.code];
  if(e.code==='Enter'&&stato!=='gioco'&&stato!=='pausa'){e.preventDefault();parti_(stato==='persa');return;}
  if((e.code==='KeyP'||e.code==='Escape')&&(stato==='gioco'||stato==='pausa')){stato=stato==='gioco'?'pausa':'gioco';return;}
  if(!k)return;e.preventDefault();if(k==='salta'&&!tasti.salta)tasti.saltaPremuto=true;tasti[k]=true;});
addEventListener('keyup',function(e){var k=MAPPA[e.code];if(k)tasti[k]=false;});
addEventListener('blur',function(){tasti={};if(stato==='gioco')stato='pausa';});
// in pausa (anche quella automatica di quando si clicca fuori) un clic o un tocco sul gioco lo fa ripartire
addEventListener('pointerdown',function(){if(stato==='pausa'){stato='gioco';tasti={};}try{window.focus();}catch(e){}});
document.addEventListener('visibilitychange',function(){if(document.hidden&&stato==='gioco')stato='pausa';});
// touch: piu' dita insieme (corri + salta + spara)
var tocco=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(tocco){document.body.classList.add('touch');document.getElementById('tastiPc').textContent='Usa i tasti sullo schermo';}
var attivi={};
function aggiornaTocchi(){var su={sx:0,dx:0,salta:0,spara:0};for(var id in attivi)if(attivi[id])su[attivi[id]]=1;
  if(su.salta&&!tasti.salta)tasti.saltaPremuto=true;
  ['sx','dx','salta','spara'].forEach(function(k){tasti[k]=!!su[k];});
  document.querySelectorAll('.tasto').forEach(function(el){el.classList.toggle('giu',!!su[el.dataset.k]);});}
function tastoSotto(x,y){var el=document.elementFromPoint(x,y);el=el&&el.closest?el.closest('.tasto'):null;return el?el.dataset.k:null;}
['pointerdown','pointermove'].forEach(function(ev){document.addEventListener(ev,function(e){if(e.pointerType==='mouse')return;
  if(ev==='pointermove'&&!(e.pointerId in attivi))return;attivi[e.pointerId]=tastoSotto(e.clientX,e.clientY);aggiornaTocchi();},{passive:true});});
['pointerup','pointercancel'].forEach(function(ev){document.addEventListener(ev,function(e){delete attivi[e.pointerId];aggiornaTocchi();});});
})();
</script>
